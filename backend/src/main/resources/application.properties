spring.application.name=monitoramento_api

# Fuso e persistencia de datas em UTC
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC

# Schema gerado pelo Hibernate a partir das entidades JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Endpoints do Actuator expostos (detalhes na secao 7 do checklist)
management.endpoints.web.exposure.include=health,prometheus

# Compose unico na raiz do monorepo (relativo ao diretorio de execucao, backend/)
spring.docker.compose.file=../compose.yaml

# Regra de alerta (secao 4): falhas seguidas para o estado DOWN
monitoramento.alerta.falhas-para-down=3

# Checagem (secao 3): timeouts do cliente HTTP, intervalo do ciclo do agendador e paralelismo
monitoramento.checagem.timeout-conexao-ms=3000
monitoramento.checagem.timeout-leitura-ms=5000
monitoramento.checagem.intervalo-ciclo-ms=5000
monitoramento.checagem.concorrencia-maxima=10

# Retencao do historico (secao 5): checagens mais antigas que N dias sao apagadas todo dia no horario do cron
monitoramento.retencao.dias=30
monitoramento.retencao.cron=0 0 3 * * *

# Origens permitidas pelo CORS (secao 6): o painel Angular roda em localhost:4200
monitoramento.cors.origens=http://localhost:4200

# Sem stack trace nas respostas de erro (secao 2)
server.error.include-stacktrace=never

# Logs estruturados em JSON no console (secao 7). Para logs legiveis no terminal, use logging.structured.format.console=
logging.structured.format.console=ecs
