spring.application.name=monitoramento_api

# Fuso e persistencia de datas em UTC
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC

# Schema versionado pelo Flyway; o Hibernate apenas valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Endpoints do Actuator expostos (detalhes na secao 7 do checklist)
management.endpoints.web.exposure.include=health,prometheus
